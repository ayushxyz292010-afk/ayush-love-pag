<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Babyyy 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 20%, #ffb3cb 0, transparent 25%),
    radial-gradient(circle at 80% 70%, #ff8fb3 0, transparent 30%),
    linear-gradient(135deg, #ff9fbd, #ff6f9f, #ffc1d5);
}

/* Heart lights */
.lights {
  position: fixed;
  top: 15px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  z-index: 1;
}

.light {
  font-size: 30px;
  animation: glow 1.8s infinite alternate;
  filter: drop-shadow(0 0 12px #fff);
}

@keyframes glow {
  from { opacity: .5; transform: scale(.9); }
  to { opacity: 1; transform: scale(1.15); }
}

/* Main */
.container {
  position: relative;
  z-index: 5;
  width: 92%;
  max-width: 600px;
  margin: 70px auto 40px;
  text-align: center;
}

/* Cute title */
.top-title {
  color: white;
  font-size: 25px;
  font-weight: bold;
  text-shadow: 0 3px 10px #d52c68;
  margin-bottom: 20px;
}

/* Paper */
.paper {
  position: relative;
  padding: 38px 25px 45px;
  border-radius: 28px;
  background: rgba(255, 244, 247, 0.94);
  box-shadow:
    0 20px 50px rgba(125, 20, 60, .25),
    inset 0 0 30px rgba(255, 150, 180, .25);
  animation: appear 1.2s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.92);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Ribbon */
.ribbon {
  position: absolute;
  top: -18px;
  left: 18px;
  font-size: 55px;
  transform: rotate(-10deg);
}

/* Heading */
h1 {
  margin: 10px 0;
  font-size: 44px;
  color: #ed1762;
  text-shadow: 2px 3px 0 #ffc4d7;
}

.subtitle {
  display: inline-block;
  background: #ffabc3;
  padding: 8px 25px;
  border-radius: 20px;
  font-size: 22px;
  font-weight: bold;
  color: #4d2635;
  margin: 8px 0 15px;
}

.chirkut {
  font-size: 30px;
  font-weight: bold;
  color: #39232c;
  margin-bottom: 25px;
}

/* Love message */
.love-box {
  background: linear-gradient(135deg, #ff477d, #f72b6b);
  border-radius: 25px;
  padding: 22px 15px;
  color: white;
  font-size: 27px;
  font-weight: bold;
  box-shadow: 0 10px 25px rgba(238, 25, 95, .25);
  animation: heartbeat 2s infinite;
}

@keyframes heartbeat {
  50% { transform: scale(1.025); }
}

.message {
  margin: 28px 5px;
  color: #432936;
  font-size: 21px;
  line-height: 1.7;
  font-weight: 600;
}

/* Forever */
.forever {
  color: #e91e63;
  font-size: 27px;
  font-weight: bold;
  margin-top: 25px;
}

/* Teddy */
.teddy {
  font-size: 95px;
  position: relative;
  margin-top: 10px;
  animation: teddyMove 3s ease-in-out infinite;
}

@keyframes teddyMove {
  50% { transform: translateY(-8px) rotate(2deg); }
}

/* Bottom heart */
.bottom-heart {
  display: inline-block;
  margin-top: 5px;
  padding: 12px 25px;
  border-radius: 20px;
  background: #ff7fa7;
  color: white;
  font-weight: bold;
  font-size: 20px;
  box-shadow: 0 5px 20px rgba(200, 30, 90, .25);
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -40px;
  z-index: 2;
  pointer-events: none;
  animation: floatUp linear forwards;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  15% { opacity: 1; }
  100% {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

/* Small sparkles */
.sparkle {
  position: fixed;
  color: white;
  font-size: 22px;
  animation: sparkle 2s infinite alternate;
  z-index: 1;
}

@keyframes sparkle {
  from { opacity: .3; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.3); }
}
</style>
</head>

<body>

<!-- Heart lights -->
<div class="lights">
  <div class="light">💗</div>
  <div class="light">💖</div>
  <div class="light">💕</div>
  <div class="light">💗</div>
  <div class="light">💖</div>
</div>

<div class="container">

  <div class="top-title">
    💞 For My Babyyy 💞
  </div>

  <div class="paper">

    <div class="ribbon">🎀</div>

    <div style="font-size:55px;">👑</div>

    <h1>
      Meri<br>Madam Ji 💗
    </h1>

    <div class="subtitle">
      Mai aapka
    </div>

    <div class="chirkut">
      Mr. Chirkut 😘💕
    </div>

    <div class="love-box">
      I LOVE YOU JAANA ❤️<br>
      I LOVE YOU FOREVER ♾️
    </div>

    <div class="message">
      Meri life ka sabse best part<br>
      ho aap 🥺💗
      <br><br>

      Apne is Chirkut ke saath<br>
      hamesa rehna bas ji 🥺💞
    </div>

    <div class="teddy">
      🧸
    </div>

    <div class="bottom-heart">
      💗 Forever & Always ♾️ 💗
    </div>

  </div>
</div>

<script>

/* Floating hearts */
const hearts = ["💗","💖","💕","❤️","💘","💞","💓"];

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";
  heart.innerHTML =
    hearts[Math.floor(Math.random() * hearts.length)];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize =
    (18 + Math.random() * 25) + "px";

  heart.style.animationDuration =
    (4 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 9000);
}

setInterval(createHeart, 450);


/* Sparkles */
function createSparkle() {

  const sparkle = document.createElement("div");

  sparkle.className = "sparkle";
  sparkle.innerHTML = "✦";

  sparkle.style.left = Math.random() * 100 + "vw";
  sparkle.style.top = Math.random() * 100 + "vh";

  document.body.appendChild(sparkle);

  setTimeout(() => {
    sparkle.remove();
  }, 2500);
}

setInterval(createSparkle, 700);

</script>

</body>
</html>
