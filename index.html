<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Babyyy 💗</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: "Trebuchet MS", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 20% 20%, #ffd6e7 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #d8c7ff 0%, transparent 30%),
        linear-gradient(135deg, #ff9fc4, #c8a7ff, #9edfff);
}

/* Background glow */
.glow {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    filter: blur(40px);
    animation: glow 5s infinite alternate;
}

@keyframes glow {
    from { transform: scale(0.8); }
    to { transform: scale(1.2); }
}

/* Main card */
.card {
    position: relative;
    width: min(90%, 500px);
    padding: 45px 25px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: 0 20px 60px rgba(90,40,100,0.25);
    z-index: 5;
}

.emoji {
    font-size: 65px;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    50% { transform: translateY(-10px) rotate(5deg); }
}

h1 {
    margin-top: 15px;
    color: white;
    font-size: 32px;
    text-shadow: 0 3px 12px rgba(100,30,80,0.3);
}

p {
    margin-top: 15px;
    color: white;
    font-size: 18px;
    line-height: 1.5;
}

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 18px;
    position: relative;
    min-height: 60px;
}

button {
    border: none;
    padding: 14px 30px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

#yes {
    background: #ff4f91;
    color: white;
}

#yes:hover {
    transform: scale(1.1);
    background: #ff287c;
}

#no {
    background: white;
    color: #555;
    position: relative;
}

/* Floating hearts */
.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Success screen */
.success {
    display: none;
}

.success h2 {
    color: white;
    font-size: 35px;
    margin-top: 15px;
}

.flowers {
    font-size: 55px;
    margin-top: 15px;
    animation: flowerPop 1s infinite alternate;
}

@keyframes flowerPop {
    from { transform: scale(0.9); }
    to { transform: scale(1.12); }
}

.loveText {
    font-size: 20px;
    margin-top: 15px;
    color: white;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="card" id="mainCard">

    <div id="question">
        <div class="emoji">🥺💗</div>

        <h1>Will You Be My Girlfriend? 💕</h1>

        <p>
            I have a little question for you...<br>
            Will you stay by my side? 🌸✨
        </p>

        <div class="buttons">
            <button id="yes">YES ❤️</button>
            <button id="no">NO 🤍</button>
        </div>
    </div>

    <div class="success" id="success">
        <div class="flowers">🌸🌷🌹🌺🌷🌸</div>

        <h2>YAYYY! 🥹💗</h2>

        <p class="loveText">
            You just made my heart so happy! 💕<br>
            I LOVE YOU SO MUCH BABYYY ❤️
        </p>

        <div class="flowers">🌹💐🌸💗🌸💐🌹</div>
    </div>

</div>

<script>

/* YES button */
document.getElementById("yes").addEventListener("click", function() {

    document.getElementById("question").style.display = "none";
    document.getElementById("success").style.display = "block";

    /* Celebration hearts + flowers */
    const items = ["❤️","💗","💕","🌸","🌷","🌹","💐","✨","💖"];

    for (let i = 0; i < 70; i++) {
        setTimeout(() => {
            createHeart(items[Math.floor(Math.random() * items.length)]);
        }, i * 60);
    }
});


/* NO button playful movement */
const noButton = document.getElementById("no");

noButton.addEventListener("click", function() {

    const x = Math.random() * 220 - 110;
    const y = Math.random() * 120 - 60;

    noButton.style.transform =
        `translate(${x}px, ${y}px)`;

    noButton.innerText = "Are you sure? 🥺";
});


/* Also moves when mouse gets close */
noButton.addEventListener("mouseenter", function() {

    const x = Math.random() * 220 - 110;
    const y = Math.random() * 120 - 60;

    noButton.style.transform =
        `translate(${x}px, ${y}px)`;
});


/* Floating background hearts */
function createHeart(symbol) {

    const heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = symbol;

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 9000);
}


/* Continuous background animation */
setInterval(() => {
    const symbols = ["💗","💕","💖","✨","🌸"];
    createHeart(symbols[Math.floor(Math.random() * symbols.length)]);
}, 700);

</script>

</body>
</html>
